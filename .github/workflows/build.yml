name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORMIO_VERSION: "6.1.19"
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"

jobs:
  firmware:
    name: ${{ matrix.project }} / ${{ matrix.env }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Keep in step with default_envs in firmware/*/platformio.ini.
      matrix:
        include:
          - { project: flightcomp, env: teensy41 }
          - { project: flightcomp, env: teensy40 }
          - { project: flightcomp, env: teensy36 }
          - { project: flightcomp, env: teensy35 }
          - { project: flightcomp, env: teensy31 }
          - { project: gndstation, env: teensy41 }
          - { project: gndstation, env: teensy40 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('firmware/*/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          PIO_ENV: ${{ matrix.env }}
        run: pio run -d "firmware/${PROJECT}" -e "${PIO_ENV}" 2>&1 | tee build.log

      - name: Report flash and RAM
        if: always()
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          PIO_ENV: ${{ matrix.env }}
        run: |
          {
            echo "### ${PROJECT} / ${PIO_ENV}"
            echo '```'
            grep -E '^(teensy_size:|RAM:|Flash:)' build.log || echo "no size output (build failed?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Unit tests of each project, compiled and run on the host (the `native` env)
  host-tests:
    name: ${{ matrix.project }} / host tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [flightcomp, gndstation]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-native-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('firmware/*/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Test
        env:
          PROJECT: ${{ matrix.project }}
        run: pio test -e native -d "firmware/${PROJECT}"

  # The firmware sources must match .clang-format (`just fmt` fixes them).
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      # .clang-format is written for clang-format 19, the major used locally;
      # the runner's default clang-format is another major, which can format
      # the same file differently.
      - name: Install clang-format 19
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-19
          clang-format-19 --version

      - name: Check formatting
        env:
          CLANG_FORMAT: clang-format-19
        run: just fmt-check

  # A single check to mark as required on master, so adding or removing an
  # env or a test job does not mean editing branch protection.
  all-builds:
    name: all builds
    if: always()
    needs: [firmware, host-tests, format]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every firmware build, the host tests and the format check to pass
        env:
          FIRMWARE: ${{ needs.firmware.result }}
          HOST_TESTS: ${{ needs.host-tests.result }}
          FORMAT: ${{ needs.format.result }}
        run: |
          echo "firmware matrix result: ${FIRMWARE}"
          echo "host tests result: ${HOST_TESTS}"
          echo "format check result: ${FORMAT}"
          test "${FIRMWARE}" = success
          test "${HOST_TESTS}" = success
          test "${FORMAT}" = success
